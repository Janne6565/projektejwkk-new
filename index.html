<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Janne Keipert - Software Developer</title>
    <meta name="description"
          content="Portfolio of Janne Keipert, a Software Developer. Browse my open-source projects, GitHub contribution history, and the technologies I work with every day."/>
    <meta name="author" content="Janne Keipert"/>
    <link rel="canonical" href="https://jannekeipert.de"/>

    <!-- Open Graph -->
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://jannekeipert.de"/>
    <meta property="og:title" content="Janne Keipert - Software Developer"/>
    <meta property="og:description"
          content="Portfolio of Janne Keipert, a Software Developer. Browse my open-source projects, GitHub contribution history, and the technologies I work with every day."/>
    <meta property="og:locale" content="en_US"/>
    <meta property="og:site_name" content="Janne Keipert"/>
    <meta property="og:image" content="https://jannekeipert.de/og-image.png"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:image:alt" content="Janne Keipert - Software Developer"/>

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Janne Keipert - Software Developer"/>
    <meta name="twitter:description"
          content="Portfolio of Janne Keipert, a Software Developer. Browse my open-source projects, GitHub contribution history, and the technologies I work with every day."/>
    <meta name="twitter:image" content="https://jannekeipert.de/og-image.png"/>
    <meta name="twitter:image:alt" content="Janne Keipert - Software Developer"/>

    <meta name="robots" content="index, follow"/>
    <meta name="theme-color" content="#000000"/>

    <!-- Preconnect to API for faster data fetching -->
    <link rel="preconnect" href="https://project-manager.jannekeipert.de" crossorigin/>
    <link rel="dns-prefetch" href="https://project-manager.jannekeipert.de"/>

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://jannekeipert.de/#person",
          "name": "Janne Keipert",
          "jobTitle": "Software Developer",
          "url": "https://jannekeipert.de"
        },
        {
          "@type": "WebSite",
          "@id": "https://jannekeipert.de/#website",
          "url": "https://jannekeipert.de",
          "name": "Janne Keipert",
          "description": "Portfolio of Janne Keipert, a Software Developer. Browse my open-source projects, GitHub contribution history, and the technologies I work with every day.",
          "author": { "@id": "https://jannekeipert.de/#person" }
        }
      ]
    }
    </script>

    <!-- Prevent dark/light mode flash: apply theme class before first paint -->
    <script>
      (function(){var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.classList.add(t)}else if(matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.classList.add('dark')}})();
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
